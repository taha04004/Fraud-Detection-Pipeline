[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "Production-oriented fraud detection pipeline with PySpark, PyTorch, MLflow, and FastAPI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mlflow>=3.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "pydantic>=2.9",
  "pyspark>=4.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "torch>=2.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

